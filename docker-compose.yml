services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: san_bong_app
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
    networks:
      - san_bong_network

  db:
    image: mysql:8.4
    container_name: san_bong_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: san_bong
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: san_bong_user
      MYSQL_PASSWORD: san_bong_password
    ports:
      - "3307:3306"
    volumes:
      - san_bong_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -proot --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - san_bong_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: san_bong_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - san_bong_network

networks:
  san_bong_network:

volumes:
  san_bong_mysql_data: